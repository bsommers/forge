name: CI — 5-Gate MCP 2026-07-28 Verification

on:
  pull_request:
    branches: ["main"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ruff, Mypy Strict, AST Audit, Coverage & STDIO Discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run 5-Gate MCP 2026-07-28 Verification Harness
        run: .venv/bin/python scripts/validate_mcp.py

      - name: Run Full Repository Lint, Strict Typecheck & Branch Coverage
        run: |
          .venv/bin/python -m ruff check src forge respx scripts tests dashboard
          .venv/bin/python -m mypy src forge respx
          .venv/bin/python -m pytest --cov=src/tools --cov=forge --cov-branch
