[project]
name = "forged-mcp-server"
version = "1.2.0"
description = "Hardened FastMCP server generated by MCP Server Forge (MCP 2026-07-28)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6,<5.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0,<10.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
mcp-server = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src", "forge", "respx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "forge", "respx", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP",
    "B",     # flake8-bugbear
    "S",     # flake8-bandit security checks
    "T20",   # flake8-print (forbids print/pprint so stdio frames stay clean)
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["src", "forge"]
known-third-party = ["respx"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"scripts/**/*.py" = ["T20", "S603"]
"forge/**/*.py" = ["T20", "S603"]
"dashboard/**/*.py" = ["T20", "S603"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
