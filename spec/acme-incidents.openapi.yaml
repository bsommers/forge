openapi: 3.1.0
info:
  title: Acme Incident Management MCP
  version: 1.0.0
  description: Stateless MCP 2026-07-28 server to query and triage operational incidents in Acme Cloud.
servers:
  - url: https://api.acme.internal/v1
    description: Internal Acme Cloud Incident Management API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-bound Bearer API token injected via environment variable.
  parameters:
    IncidentIdParam:
      name: incident_id
      in: path
      required: true
      description: Unique identifier of the incident (e.g., 'INC-1042').
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
  schemas:
    CommanderInfo:
      type: object
      properties:
        name:
          type: string
          description: Display name of the incident commander.
        email:
          type: string
          description: Contact email of the incident commander.
    IncidentRecord:
      type: object
      required:
        - id
        - title
        - severity
        - status
      properties:
        id:
          type: string
          description: Unique incident identifier.
        title:
          type: string
          description: Short human-readable summary of the incident.
        severity:
          type: string
          enum: [sev1, sev2, sev3, sev4]
          description: Severity tier (e.g., sev1, sev2, sev3).
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
          description: Lifecycle state (investigating, identified, resolved).
        commander:
          $ref: "#/components/schemas/CommanderInfo"
        updated_at:
          type: string
          description: ISO-8601 timestamp of last update.
    IncidentListPayload:
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRecord"
        next_cursor:
          type: string
          description: Opaque pagination cursor for the next page of incidents.
    CreateIncidentRequest:
      type: object
      required:
        - title
        - severity
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
          description: Concise summary of the operational incident.
        severity:
          type: string
          enum: [sev1, sev2, sev3, sev4]
          description: Initial severity classification (sev1, sev2, sev3, sev4).
        service:
          type: string
          description: Affected service or subsystem identifier.
        commander:
          type: string
          description: Optional incident commander handle or name.
    UpdateIncidentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
          description: Target lifecycle status for the incident.
        resolution_note:
          type: string
          description: Optional status update or resolution summary note.
paths:
  /incidents:
    get:
      operationId: list_incidents
      summary: List Operational Incidents
      description: Query operational incidents filtered by severity, lifecycle status, or pagination cursor.
      tags:
        - incidents
      parameters:
        - name: severity
          in: query
          required: false
          description: Filter incidents by severity tier (sev1, sev2, sev3, sev4).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter incidents by lifecycle state (investigating, identified, resolved).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of incident summaries to return (1-100).
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a previous list_incidents response.
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of operational incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListPayload"
    post:
      operationId: create_incident
      summary: Create Operational Incident
      description: Declare a new operational incident with title, severity tier, and affected service.
      tags:
        - incidents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: Newly created incident record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentRecord"
  /incidents/{incident_id}:
    parameters:
      - $ref: "#/components/parameters/IncidentIdParam"
    get:
      operationId: get_incident
      summary: Get Incident Summary
      description: Fetch concise details and current operational status for a single incident by ID.
      tags:
        - incidents
      responses:
        "200":
          description: Incident summary details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentRecord"
    delete:
      operationId: delete_incident
      summary: Delete Incident Record
      description: Permanently delete a duplicate or test incident record by its unique identifier.
      tags:
        - incidents
      responses:
        "204":
          description: Incident record deleted.
  /incidents/{incident_id}/status:
    parameters:
      - $ref: "#/components/parameters/IncidentIdParam"
    put:
      operationId: update_incident_status
      summary: Update Incident Status
      description: Transition an existing incident to a new lifecycle status and record a status note.
      tags:
        - incidents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIncidentStatusRequest"
      responses:
        "200":
          description: Updated incident record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentRecord"
